name: Comprobar motor e interfaz Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas del motor
        run: python -B -m unittest discover -s fuentes -p test_converter.py -v
      - name: Preparar Zig 0.13.0
        shell: pwsh
        run: |
          $index = Invoke-RestMethod 'https://ziglang.org/download/index.json'
          $release = $index.'0.13.0'.'x86_64-windows'
          Invoke-WebRequest $release.tarball -OutFile "$env:RUNNER_TEMP/zig.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/zig.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $release.shasum) {
            throw 'El SHA256 de Zig no coincide con el publicado por el proveedor.'
          }
          Expand-Archive "$env:RUNNER_TEMP/zig.zip" "$env:RUNNER_TEMP/zig"
          $zig = Get-ChildItem "$env:RUNNER_TEMP/zig" -Recurse -Filter zig.exe | Select-Object -First 1
          $zig.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compilar interfaz nativa
        shell: pwsh
        run: ./fuentes/compilar_windows.ps1
      - name: Inspeccionar paneles nativos CE3X 2.3
        shell: pwsh
        run: |
          $stage23 = Join-Path $env:RUNNER_TEMP 'ce3x23'
          New-Item -ItemType Directory -Path $stage23 -Force | Out-Null
          Invoke-WebRequest 'https://www6.serviciosmin.gob.es/aplicaciones/calener/setupCE3Xv2.3.exe' -OutFile "$stage23/setup.exe"
          if ((Get-FileHash "$stage23/setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5cb86c17900bb383577bb31f78251f22d722db2f185d16d69b4decfef57ae82c') { throw 'Ha cambiado el instalador oficial 2.3.' }
          Invoke-WebRequest 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/418937d9913c67b9abbe93a2e9e725a06f0f2be7/innounp-2/bin/innounp-2.zip' -OutFile "$stage23/tool.zip"
          if ((Get-FileHash "$stage23/tool.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f8e45c9676bebc7d7570108ab572673b541fcf7a7d3d24a04319ac6b5315b4e8') { throw 'SHA incorrecto del extractor.' }
          Expand-Archive "$stage23/tool.zip" "$stage23/tool"
          & "$stage23/tool/innounp.exe" -x -m "-d$stage23/native" "$stage23/setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo extraer CE3X 2.3.' }
          $nativeApp = Get-ChildItem "$stage23/native" -Recurse -Filter python27.dll | Select-Object -First 1
          zig cc -target x86-windows-gnu -O2 fuentes/probe_python27.c -o "$stage23/probe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo compilar la sonda.' }
          New-Item -ItemType Directory -Path _validacion -Force | Out-Null
          $env:CE3X_PROBE_OUTPUT = "$pwd/_validacion/paneles_nativos_23.json"
          & "$stage23/probe.exe" $nativeApp.DirectoryName "$pwd/scripts/inspeccionar_paneles_23.py"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo ejecutar la sonda nativa.' }
      - name: Preparar Python portatil
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile "$env:RUNNER_TEMP/python.zip"
          Expand-Archive "$env:RUNNER_TEMP/python.zip" runtime
          ./runtime/python.exe -I -X utf8 -B app/converter.py self-test
          if ($LASTEXITCODE -ne 0) { throw 'Fallo del motor con Python portatil.' }
          ./runtime/python.exe -I -X utf8 -B -m unittest discover -s fuentes -p test_converter.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Fallo de regresion con Python portatil.' }
      - name: Probar comunicacion entre interfaz y motor
        shell: pwsh
        run: |
          $resultPath = "$env:RUNNER_TEMP/ce3x_selftest.txt"
          $process = Start-Process -FilePath "$pwd/Conversor_CE3X.exe" -ArgumentList @('--self-test', $resultPath) -PassThru -Wait
          if ($process.ExitCode -ne 0 -or (Get-Content $resultPath -Raw).Trim() -ne 'OK') {
            throw 'Fallo de comunicacion entre el ejecutable y Python.'
          }
      - name: Probar decisiones desde la interfaz y el motor portatil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _validacion -Force | Out-Null
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'fuentes'); import test_converter as t; x=t.ConverterTests(); x.setUp(); x.solar_fixture(); Path('_validacion/solar_sintetica.cex').write_bytes(t.c.encoded(x.src)); x.tearDown()"
          if ($LASTEXITCODE -ne 0) { throw 'Fallo al crear la muestra sintetica.' }
          foreach ($choice in @('adapt','omit','cancel')) {
            $source = "$pwd/_validacion/solar_$choice.cex"
            Copy-Item _validacion/solar_sintetica.cex $source
            $marker = "$pwd/_validacion/decision_$choice.txt"
            $process = Start-Process -FilePath "$pwd/Conversor_CE3X.exe" -ArgumentList @('--smoke-decision', $source, $choice, $marker) -PassThru -Wait
            if ($process.ExitCode -ne 0 -or (Get-Content $marker -Raw).Trim() -ne 'OK') { throw "Fallo de decision nativa: $choice" }
            $output = "$pwd/_validacion/solar_${choice}_CE3X2.3.cex"
            if ($choice -eq 'cancel' -and (Test-Path $output)) { throw 'Cancelar ha generado una salida.' }
            if ($choice -ne 'cancel' -and -not (Test-Path $output)) { throw 'No se ha generado la salida elegida.' }
          }
      - name: Revisar ejemplos oficiales de CE3X 3.2
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'ce3x_oficial'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $package = Join-Path $staging 'CE3Xv3.2.zip'
          Invoke-WebRequest 'https://www.miteco.gob.es/content/dam/miteco/es/energia/eficiencia/certificacionenergetica/documentosreconocidos/procedimientoscertificacion/ce3x/CE3Xv3.2.zip' -OutFile $package
          if ((Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd92bea9f25ebd60c30ef9043ffdd3339fc84065eb415b2629b8a77f948f6b9dd') { throw 'Ha cambiado el paquete oficial: revisar las muestras.' }
          Expand-Archive $package (Join-Path $staging 'installer')
          $tool = Join-Path $staging 'innounp.zip'
          Invoke-WebRequest 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/418937d9913c67b9abbe93a2e9e725a06f0f2be7/innounp-2/bin/innounp-2.zip' -OutFile $tool
          if ((Get-FileHash $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f8e45c9676bebc7d7570108ab572673b541fcf7a7d3d24a04319ac6b5315b4e8') { throw 'SHA256 incorrecto de la herramienta de extraccion.' }
          Expand-Archive $tool (Join-Path $staging 'tool')
          $examples = Join-Path $staging 'examples'
          & "$staging/tool/innounp.exe" -x -m "-d$examples" "$staging/installer/setupCE3Xv3.2.exe" '*.cex'
          if ($LASTEXITCODE -ne 0) { throw 'Fallo al extraer los ejemplos sin instalar CE3X.' }
          python -B scripts/probar_ejemplos.py $examples --report _validacion/ejemplos_oficiales.json
          if ($LASTEXITCODE -ne 0) { throw 'Fallo en la inspeccion de ejemplos oficiales.' }
      - name: Crear paquete portatil
        shell: pwsh
        run: python -B scripts/empaquetar.py
      - name: Capturar interfaz nativa
        shell: pwsh
        run: |
          $bitmapPath = "$pwd/_release/vista_previa.bmp"
          $process = Start-Process -FilePath "$pwd/Conversor_CE3X.exe" -ArgumentList @('--preview', $bitmapPath) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'No se pudo capturar la interfaz.' }
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Image]::FromFile($bitmapPath)
          try { $image.Save("$pwd/_release/vista_previa.png", [System.Drawing.Imaging.ImageFormat]::Png) }
          finally { $image.Dispose() }
          Remove-Item $bitmapPath
          foreach ($mode in @('adapt', 'omit')) {
            $bitmapPath = "$pwd/_release/decision_$mode.bmp"
            $process = Start-Process -FilePath "$pwd/Conversor_CE3X.exe" -ArgumentList @('--preview-decision', $bitmapPath, $mode) -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw 'No se pudo capturar el dialogo de decision.' }
            $image = [System.Drawing.Image]::FromFile($bitmapPath)
            try { $image.Save("$pwd/_release/decision_$mode.png", [System.Drawing.Imaging.ImageFormat]::Png) }
            finally { $image.Dispose() }
            Remove-Item $bitmapPath
          }
      - name: Conservar paquete y vista previa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Conversor_CE3X_1_5_1_artefactos
          path: |
            _release/*
            _validacion/**
          retention-days: 14
